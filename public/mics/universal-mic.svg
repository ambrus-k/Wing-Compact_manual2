<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="metalBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#52525b"/>
      <stop offset="35%" stop-color="#a1a1aa"/>
      <stop offset="70%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#3f3f46"/>
    </linearGradient>
    <linearGradient id="grilleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="30%" stop-color="#71717a"/>
      <stop offset="50%" stop-color="#a1a1aa"/>
      <stop offset="80%" stop-color="#52525b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <pattern id="meshPattern" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 6 6 M 6 0 L 0 6" fill="none" stroke="#27272a" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="400" height="400" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Subtle circular backdrop glow -->
  <circle cx="200" cy="180" r="130" fill="#10b981" opacity="0.06"/>
  <circle cx="200" cy="180" r="100" fill="#ffffff" opacity="0.02"/>

  <!-- Stand Base -->
  <ellipse cx="200" cy="345" rx="70" ry="12" fill="#18181b" stroke="#3f3f46" stroke-width="2.5"/>
  <ellipse cx="200" cy="342" rx="46" ry="8" fill="#27272a"/>

  <!-- Stand Shaft -->
  <rect x="195" y="270" width="10" height="74" fill="url(#metalBody)" rx="2"/>
  
  <!-- Shock Mount / Swivel Ring -->
  <ellipse cx="200" cy="270" rx="32" ry="10" fill="none" stroke="#52525b" stroke-width="3"/>
  <circle cx="168" cy="270" r="4" fill="#a1a1aa"/>
  <circle cx="232" cy="270" r="4" fill="#a1a1aa"/>

  <!-- Lower connector / XLR collar -->
  <rect x="193" y="248" width="14" height="24" fill="#27272a" rx="2"/>
  <rect x="191" y="244" width="18" height="6" fill="url(#accentGrad)" rx="1"/>

  <!-- Microphone Main Body -->
  <rect x="174" y="160" width="52" height="86" rx="6" fill="url(#metalBody)"/>
  
  <!-- Center branding badge / indicator -->
  <rect x="196" y="180" width="8" height="12" rx="2" fill="#10b981" opacity="0.9"/>
  <circle cx="200" cy="205" r="2.5" fill="#e4e4e7" opacity="0.7"/>

  <!-- Capsule Ring Collar -->
  <rect x="170" y="152" width="60" height="9" rx="3" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>

  <!-- Capsule Head / Grille Dome -->
  <path d="M 172 152 C 172 108, 228 108, 228 152 Z" fill="url(#grilleGrad)"/>
  <path d="M 172 152 C 172 108, 228 108, 228 152 Z" fill="url(#meshPattern)"/>
  <path d="M 172 152 C 172 108, 228 108, 228 152 Z" fill="none" stroke="#52525b" stroke-width="2"/>
  
  <!-- Grille Center Rib -->
  <line x1="200" y1="110" x2="200" y2="152" stroke="#a1a1aa" stroke-width="1.5" opacity="0.6"/>

  <!-- Sound Waves (Subtle stylized acoustic lines) -->
  <path d="M 148 115 A 28 28 0 0 0 148 145" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <path d="M 134 105 A 44 44 0 0 0 134 155" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
  
  <path d="M 252 115 A 28 28 0 0 1 252 145" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <path d="M 266 105 A 44 44 0 0 1 266 155" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.45"/>

  <!-- Label at bottom -->
  <text x="200" y="382" text-anchor="middle" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">MIKROFON</text>
</svg>
