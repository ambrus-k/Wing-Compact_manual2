<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="50%" stop-color="#09090B" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9B42" />
      <stop offset="50%" stop-color="#F27D26" />
      <stop offset="100%" stop-color="#C85200" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F27D26" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#F27D26" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#F27D26" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#27272A" stroke-width="6" />
  
  <!-- Subtle Grid Accent -->
  <path d="M 64 256 H 448 M 256 64 V 448" stroke="#27272A" stroke-width="2" stroke-dasharray="8 8" opacity="0.4" />
  
  <!-- WING Emblem (Stylized Dynamic W / Wings) -->
  <g filter="url(#shadow)">
    <!-- Left Wing -->
    <path d="M 96 170 L 176 340 L 220 250 L 160 170 Z" fill="url(#orangeGrad)" />
    <!-- Center V Crest -->
    <path d="M 220 250 L 256 320 L 292 250 L 256 180 Z" fill="#FFFFFF" opacity="0.95" />
    <!-- Right Wing -->
    <path d="M 416 170 L 336 340 L 292 250 L 352 170 Z" fill="url(#orangeGrad)" />
    <!-- Bottom Anchor Peak -->
    <polygon points="256,380 200,340 312,340" fill="url(#orangeGrad)" />
  </g>

  <!-- Fader Slot & Knob Accent -->
  <rect x="248" y="110" width="16" height="60" rx="8" fill="#27272A" />
  <rect x="240" y="130" width="32" height="18" rx="4" fill="#F27D26" stroke="#FFFFFF" stroke-width="2" />

  <!-- Audio Waves Indicator -->
  <rect x="130" y="380" width="12" height="24" rx="6" fill="#F27D26" opacity="0.8" />
  <rect x="154" y="365" width="12" height="42" rx="6" fill="#F27D26" />
  <rect x="178" y="385" width="12" height="18" rx="6" fill="#F27D26" opacity="0.6" />

  <rect x="322" y="385" width="12" height="18" rx="6" fill="#F27D26" opacity="0.6" />
  <rect x="346" y="365" width="12" height="42" rx="6" fill="#F27D26" />
  <rect x="370" y="380" width="12" height="24" rx="6" fill="#F27D26" opacity="0.8" />

  <!-- Metallic Trim Accent -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#orangeGrad)" stroke-width="3" opacity="0.25" />
</svg>
